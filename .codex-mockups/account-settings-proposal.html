<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account Settings Proposal</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 576px;
        min-height: 1280px;
        background: #111111;
        font-family: Arial, sans-serif;
        color: #181b26;
      }

      .phone {
        width: 576px;
        min-height: 1280px;
        background: linear-gradient(180deg, #f4f3fb 0%, #f7f8fc 100%);
        padding: 72px 20px 26px;
      }

      .sheet {
        min-height: 1114px;
        border: 1px solid #dde0eb;
        border-radius: 34px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 24px 70px rgba(40, 46, 82, 0.18);
        padding: 28px 28px 26px;
      }

      .head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 24px;
      }

      .eyebrow {
        display: block;
        color: #6652e6;
        font-size: 15px;
        font-weight: 900;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin: 0 0 8px;
      }

      h1 {
        margin: 0;
        color: #171a25;
        font-size: 36px;
        line-height: 0.98;
        font-weight: 900;
      }

      .close {
        width: 68px;
        height: 68px;
        border: 1px solid #e1e4ee;
        border-radius: 20px;
        background: #ffffff;
        color: #6c7282;
        box-shadow: 0 12px 28px rgba(44, 51, 86, 0.12);
        font-size: 38px;
        line-height: 1;
      }

      .accountHero,
      .panel {
        border: 1px solid #e1e4ef;
        border-radius: 26px;
        background: #ffffff;
        box-shadow: 0 16px 34px rgba(45, 52, 86, 0.08);
      }

      .accountHero {
        display: grid;
        grid-template-columns: 92px 1fr;
        align-items: center;
        gap: 20px;
        padding: 20px;
        margin-bottom: 14px;
      }

      .avatar {
        width: 92px;
        height: 92px;
        border-radius: 28px;
        overflow: hidden;
        background: #e9e6ff;
        box-shadow: inset 0 0 0 1px #d8d3ff;
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .accountHero strong {
        display: block;
        font-size: 29px;
        line-height: 1.05;
        font-weight: 900;
        margin-bottom: 7px;
      }

      .accountHero small {
        display: block;
        color: #7b8294;
        font-size: 16px;
        font-weight: 800;
        margin-bottom: 14px;
      }

      .miniAction {
        width: fit-content;
        border: 1px solid #dedaf8;
        border-radius: 999px;
        background: #f2f0ff;
        color: #5542df;
        padding: 9px 15px;
        font-size: 14px;
        font-weight: 900;
      }

      .panel {
        padding: 18px;
        margin-top: 14px;
      }

      .panelTitle {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 14px;
        color: #6f7688;
        font-size: 14px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .formGrid {
        display: grid;
        gap: 12px;
      }

      label {
        display: grid;
        gap: 8px;
        color: #6f7688;
        font-size: 15px;
        font-weight: 900;
      }

      .input {
        min-height: 62px;
        border: 1px solid #e1e3ed;
        border-radius: 20px;
        background: #fbfbfe;
        padding: 18px 20px;
        color: #171a25;
        font-size: 22px;
        font-weight: 800;
      }

      .row {
        display: grid;
        grid-template-columns: 56px 1fr auto;
        align-items: center;
        gap: 14px;
        min-height: 78px;
        border: 1px solid #e3e5ee;
        border-radius: 22px;
        background: #ffffff;
        padding: 12px 14px;
      }

      .row + .row {
        margin-top: 10px;
      }

      .icon {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: #f0edff;
        font-size: 28px;
      }

      .row strong {
        display: block;
        font-size: 22px;
        line-height: 1.05;
        font-weight: 900;
      }

      .row small {
        display: block;
        margin-top: 5px;
        color: #7e8698;
        font-size: 15px;
        line-height: 1.2;
        font-weight: 800;
      }

      .arrow {
        color: #7a7f8b;
        font-size: 34px;
        font-weight: 900;
      }

      .badge {
        min-width: 104px;
        border-radius: 999px;
        background: #edf8ef;
        color: #447a4a;
        padding: 8px 12px;
        text-align: center;
        font-size: 14px;
        font-weight: 900;
      }

      .save {
        width: 100%;
        min-height: 68px;
        border: 0;
        border-radius: 22px;
        background: linear-gradient(135deg, #6d48f4, #2872f4);
        color: #ffffff;
        box-shadow: 0 16px 34px rgba(55, 86, 224, 0.25);
        font-size: 22px;
        font-weight: 900;
        margin-top: 18px;
      }

      .danger {
        width: 100%;
        min-height: 58px;
        border: 1px solid #f2d4d4;
        border-radius: 20px;
        background: #fff4f4;
        color: #d36a6d;
        font-size: 18px;
        font-weight: 900;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <main class="phone">
      <section class="sheet">
        <header class="head">
          <div>
            <span class="eyebrow">Личный кабинет</span>
            <h1>Аккаунт</h1>
          </div>
          <button class="close" aria-label="Закрыть">×</button>
        </header>

        <section class="accountHero">
          <div class="avatar">
            <img src="file:///C:/Users/workk/Downloads/photo_2026-07-02_14-12-24%20(2).jpg" alt="" />
          </div>
          <div>
            <strong>ILYA</strong>
            <small>ilya@gmail.com</small>
            <div class="miniAction">Изменить аватар</div>
          </div>
        </section>

        <section class="panel">
          <p class="panelTitle">Данные профиля</p>
          <div class="formGrid">
            <label>
              Имя
              <div class="input">ILYA</div>
            </label>
            <label>
              Почта
              <div class="input">ilya@gmail.com</div>
            </label>
          </div>
          <button class="save">Сохранить изменения</button>
        </section>

        <section class="panel">
          <p class="panelTitle">Безопасность и вход</p>
          <div class="row">
            <span class="icon">🔐</span>
            <span>
              <strong>Пароль</strong>
              <small>Отправить ссылку для смены на почту</small>
            </span>
            <span class="arrow">›</span>
          </div>
        </section>

        <section class="panel">
          <p class="panelTitle">Приложение</p>
          <div class="row">
            <span class="icon">🌙</span>
            <span>
              <strong>Оформление</strong>
              <small>Сейчас светлый стиль</small>
            </span>
            <span class="arrow">›</span>
          </div>
          <div class="row">
            <span class="icon">✈️</span>
            <span>
              <strong>Telegram</strong>
              <small>@IlyaMikhailau</small>
            </span>
            <span class="badge">Подключён</span>
          </div>
        </section>

        <button class="danger">Выйти из аккаунта</button>
      </section>
    </main>
  </body>
</html>
