<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/ownset.svg?v=gradient-1" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Zmena</title>
    <link rel="manifest" href="/manifest.json?v=zmena-1" />
    <meta name="theme-color" content="#F5F7F8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Zmena" />
    <meta name="application-name" content="Zmena" />
    <link rel="apple-touch-icon" href="/icons/ownset-180.png?v=gradient-1" />
    <script id="telegram-web-app-sdk" async src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <style>
      html,body,#root{min-height:100%;margin:0;background:#f5f7f8}
      html{-webkit-tap-highlight-color:transparent}
      /* Match AuthScreens.module.css AppSplash before React and its CSS load. */
      #startup{box-sizing:border-box;width:min(100%,402px);min-height:100dvh;margin:0 auto;display:grid;place-items:center;overflow:hidden;padding:max(24px,env(safe-area-inset-top,0px)) 24px max(24px,env(safe-area-inset-bottom,0px));color:#1c282e;background:#f5f7f8;font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;text-align:center}
      #startup-inner{box-sizing:border-box;position:relative;display:flex;width:min(100%,320px);flex-direction:column;align-items:center;justify-content:center}
      #startup img{display:block;width:68px;height:68px;flex-shrink:0;margin-bottom:20px;object-fit:contain}
      #startup h1{margin:0;color:#1c282e;font-size:44px;font-weight:900;line-height:.95;letter-spacing:-.035em}
      #startup-message{margin:14px 0 0;color:#617078;font-size:15px;font-weight:800;letter-spacing:.02em}
      #startup-caption{max-width:250px;margin:6px 0 0;color:#9a94a1;font-size:12px;font-weight:600;line-height:1.35;text-align:center}
      #startup-progress{width:220px;height:5px;margin-top:28px;overflow:hidden;border-radius:999px;background:rgba(57,82,91,.12)}
      #startup-progress span{display:block;width:42%;height:100%;border-radius:inherit;background:linear-gradient(115deg,#467b72,#3e748b 54%,#3565a3);animation:startup-loading 1.2s ease-in-out infinite}
      @keyframes startup-loading{0%{transform:translateX(-115%)}55%{transform:translateX(95%)}100%{transform:translateX(245%)}}
      @media(prefers-reduced-motion:reduce){#startup-progress span{animation:none}}
      #startup button{min-height:48px;padding:12px 24px;border:0;border-radius:14px;background:linear-gradient(115deg,#467b72,#3e748b 54%,#3565a3);color:white;font:inherit;cursor:pointer}
    </style>
  </head>
  <body>
    <div id="root"><main id="startup" role="status" aria-label="Загрузка приложения" aria-busy="true"><div id="startup-inner"><img src="/brand/ownset.svg?v=gradient-1" width="68" height="68" alt="" /><h1>Zmena</h1><p id="startup-message">Загрузка приложения</p><p id="startup-caption">Готовим ваши тренировки и прогресс</p><div id="startup-progress" aria-hidden="true"><span></span></div><button id="startup-retry" hidden type="button">Повторить загрузку</button><noscript>Для работы приложения включите JavaScript в браузере.</noscript></div></main></div>
    <script>
      (() => {
        const retry = document.getElementById('startup-retry');
        retry.addEventListener('click', () => location.reload());
        window.showStartupFailure = () => {
          const message = document.getElementById('startup-message');
          if (!message) return;
          message.textContent = 'Загрузка задерживается. Проверьте соединение и попробуйте ещё раз.';
          retry.hidden = false;
        };
        window.addEventListener('error', window.showStartupFailure, true);
        setTimeout(window.showStartupFailure, 15000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
