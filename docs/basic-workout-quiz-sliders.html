<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Подбор программы · интерактивный макет</title>
  <link rel="stylesheet" href="basic-workout-quiz-sliders.css">
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></symbol>
    <symbol id="target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
    <symbol id="dumbbell" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11m3-3-6 6m-12-12 6-6M5 4 4 5m15 15 1-1M4 9l5-5 3 3-5 5zm8 8 5-5 3 3-5 5z"/></symbol>
    <symbol id="heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
    <symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-8H9v8H4a1 1 0 0 1-1-1Z"/></symbol>
    <symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18m-12 4h.01M12 15h.01M16 15h.01M8 18h.01M12 18h.01"/></symbol>
    <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></symbol>
    <symbol id="chart" viewBox="0 0 24 24"><path d="M5 20V10m7 10V4m7 16V7"/></symbol>
    <symbol id="food" viewBox="0 0 24 24"><path d="M5 3v7m3-7v7M2 3v7a3 3 0 0 0 6 0m-3 3v8M20 3c-4 0-6 4-6 8h6M20 3v18"/></symbol>
    <symbol id="sparkles" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5ZM20 2v4m-2-2h4"/></symbol>
    <symbol id="edit" viewBox="0 0 24 24"><path d="m16 4 4 4M4 20l4-1L21 6a2.8 2.8 0 0 0-4-4L4 15Z"/></symbol>
    <symbol id="shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6Z"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="wifi" viewBox="0 0 24 24"><path d="M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0m-10 4a5 5 0 0 1 6 0M12 20h.01"/></symbol>
    <symbol id="signal" viewBox="0 0 24 24"><path d="M4 20v-3m5 3v-7m5 7V9m5 11V4"/></symbol>
  </defs></svg>
  <div class="studio">
    <aside class="guide" aria-label="Навигация по макету">
      <div class="prototype-tag"><span></span> ИНТЕРАКТИВНЫЙ МАКЕТ · 01</div>
      <h1>Подбор<br>программы</h1>
      <p>Один вопрос — один выбор.<br>В привычном стиле приложения.</p>
      <nav id="route-nav" aria-label="Экраны анкеты"></nav>
      <div class="guide-note"><strong>iPhone 17 Pro</strong><span>402 × 874 · безопасные зоны учтены</span><span>Демонстрационные данные.<br>ИИ не вызывается, ответы не сохраняются.</span></div>
    </aside>
    <div class="device-wrap">
      <section class="phone" aria-label="Макет приложения для iPhone 17 Pro">
        <div class="status" aria-hidden="true"><b>9:41</b><span class="island"></span><div><svg><use href="#signal"/></svg><svg><use href="#wifi"/></svg><i class="battery"></i></div></div>
        <header class="app-header"><button class="icon-button" id="back" aria-label="Назад"><svg><use href="#chevron-left"/></svg></button><strong>План на 4 недели</strong><button id="reset" class="icon-button" aria-label="Начать макет заново"><svg><use href="#close"/></svg></button></header>
        <div class="progress-wrap" id="progress-wrap"><div><span id="step-label"></span><span id="step-count"></span></div><div class="progress-track"><i id="progress-fill"></i></div></div>
        <main id="content" class="content"></main>
        <footer class="actions"><span id="footer-note"></span><button id="next" class="primary"></button></footer>
        <nav class="bottom-nav" aria-label="Основные разделы"><button data-destination="Сегодня"><svg><use href="#home"/></svg><span>Сегодня</span></button><button aria-current="page" data-destination="Тренировки"><svg><use href="#dumbbell"/></svg><span>Тренировки</span></button><button data-destination="Питание"><svg><use href="#food"/></svg><span>Питание</span></button><button data-destination="Прогресс"><svg><use href="#chart"/></svg><span>Прогресс</span></button><button data-destination="Кабинет"><svg><use href="#user"/></svg><span>Кабинет</span></button></nav>
        <div class="home-area" aria-hidden="true"><i></i></div>
        <div class="toast" id="toast" role="status" hidden></div>
        <dialog id="dialog"><div id="dialog-content"></div></dialog>
      </section>
      <div class="device-caption">Макет · можно пройти все шаги и вернуться к ответам</div>
    </div>
  </div>
  <script src="basic-workout-quiz-sliders.js"></script>
</body>
</html>
