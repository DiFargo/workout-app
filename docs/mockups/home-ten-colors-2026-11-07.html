<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zmena — 10 палитр главного экрана</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9ebef;color:#1c1c1e;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}header{padding:30px 28px 18px;max-width:1500px;margin:auto}h1{font-size:28px;letter-spacing:-.7px;margin:0 0 10px}p{color:#636366;font-size:14px;line-height:1.5;margin:0}main{display:grid;grid-template-columns:repeat(auto-fit,402px);justify-content:center;gap:28px;padding:18px 24px 40px}.variant{width:402px}.label{display:flex;justify-content:space-between;align-items:center;margin:0 5px 12px;gap:10px}.label h2{font-size:16px;font-weight:600;margin:0}.swatches{display:flex;gap:5px}.swatches i{height:16px;width:16px;border-radius:50%;border:1px solid #0000000a}iframe{display:block;width:402px;height:874px;border:1px solid #ffffffa0;border-radius:38px;background:#f2f2f7;box-shadow:0 8px 24px #1c1c1e0b}.description{font-size:12px;margin:12px 5px 0;min-height:36px}@media(max-width:440px){main{display:block;padding:16px 10px}.variant{width:100%;margin-bottom:28px}iframe{width:100%;height:874px}header{padding:24px 16px}h1{font-size:25px}}</style></head>
<body><header><h1>10 выразительных градиентов</h1><p>Новая подборка: заметный переход между двумя цветами вместо почти однотонной заливки.<br>Одинаковая компоновка и нейтральное стекло помогают сравнить именно цвет. Это варианты макета, не изменения приложения.</p></header><main id="variants"></main>
<script>
const variants=[['Изумруд → сапфир','#087654','#2855ce','Насыщенный зелёный переходит в чистый синий. Ближе всего к характеру Zmena.'],['Бирюза → индиго','#087d83','#4a39c2','Прохладный переход с отчётливым сине-фиолетовым завершением.'],['Лазурь → аметист','#096bc2','#7535bd','Более технологичный характер: яркий синий и глубокий фиолетовый.'],['Индиго → малина','#4b44c5','#b32579','Выразительный, но не неоновый переход от холодного к тёплому.'],['Ягода → фиолетовый','#b52b68','#7136c5','Тёплый ягодный акцент плавно уходит в холодный фиолетовый.'],['Нефрит → океан','#087b69','#1250a5','Сдержанная альтернатива первому варианту: зелёная бирюза и глубокий океан.'],['Медь → рубин','#a44617','#b51f62','Энергичный тёплый градиент с медным началом и малиновым краем.'],['Лес → лагуна','#316a28','#087c94','Природный зелёный с заметным переходом в прохладную бирюзу.'],['Сапфир → коралл','#314aa7','#bd345a','Контрастный холодно-тёплый переход для более эмоционального интерфейса.'],['Аметист → петроль','#6b3bb5','#167c85','Необычный глубокий переход: фиолетовый, синий и зелёная бирюза.']];
document.querySelector('main').innerHTML=variants.map(([name,a,b,description],i)=>`<section class="variant"><div class="label"><h2>${String(i+1).padStart(2,'0')} · ${name}</h2><span class="swatches" aria-hidden="true"><i style="background:${a}"></i><i style="background:${b}"></i></span></div><iframe title="${i+1}. ${name}" src="/?screen=0&palette=${i}" loading="lazy"></iframe><p class="description">${description}</p></section>`).join('');
</script></body></html>
