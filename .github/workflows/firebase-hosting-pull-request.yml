name: Staging Hosting preview on PR

on:
  pull_request:

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  quality:
    # Preview channels are staging acceptance environments, so they must pass
    # the same core gate before a service account receives deploy authority.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.STAGING_FIREBASE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run verify:core

  build_and_preview:
    # A PR preview must never publish into the production Firebase project.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.STAGING_FIREBASE_PROJECT_ID != '' }}
    needs: quality
    runs-on: ubuntu-latest
    environment: staging
    env:
      VITE_FIREBASE_ENVIRONMENT: staging
      VITE_FIREBASE_API_KEY: ${{ secrets.STAGING_VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.STAGING_VITE_FIREBASE_AUTH_DOMAIN }}
      # A Firebase project ID is not a secret. Reuse the one deployment target
      # everywhere so the artifact guard can detect any accidental mismatch.
      VITE_FIREBASE_PROJECT_ID: ${{ vars.STAGING_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.STAGING_VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.STAGING_VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.STAGING_VITE_FIREBASE_APP_ID }}
      VITE_APP_CHECK_SITE_KEY: ${{ vars.STAGING_VITE_APP_CHECK_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:staging
      - run: npm run check:firebase-artifact -- --environment=staging --project "${{ vars.STAGING_FIREBASE_PROJECT_ID }}"
      - uses: FirebaseExtended/action-hosting-deploy@7c850a480ce753f4f06f010801fc5a43787740bb # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          projectId: ${{ vars.STAGING_FIREBASE_PROJECT_ID }}
